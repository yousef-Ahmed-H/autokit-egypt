  <text x="320" y="330" text-anchor="middle" font-family="Cairo, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">تنظيم وأدوات الطريق</text>

  <rect x="190" y="360" width="260" height="42" rx="21" fill="#ffffff" fill-opacity="0.08"/>
  <text x="320" y="387" text-anchor="middle" font-family="Cairo, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="20" font-weight="700" fill="#ff8a3d">قسم — Placeholder</text>
